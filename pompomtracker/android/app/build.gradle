plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

def versionProps = new Properties()
file("$rootDir/../version.properties").withInputStream {
    versionProps.load(it)
}

def versionMajor = versionProps['versionMajor'].toInteger()
def versionMinor = versionProps['versionMinor'].toInteger()
def versionPatch = versionProps['versionPatch'].toInteger()

android {
    namespace = "com.example.pompomtracker"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions{
        jvmTarget='17'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ditsbus.pompomtracker"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 24
        targetSdk = 35
        versionCode = versionMajor * 10000 + versionMinor * 100 + versionPatch
        versionName = "${versionMajor}.${versionMinor}.${versionPatch}"
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}
afterEvaluate {
    def pubspecFile = rootProject.file("../pubspec.yaml")

    if (pubspecFile.exists()) {
        def lines = pubspecFile.readLines()
        def newVersion = "version: ${versionMajor}.${versionMinor}.${versionPatch}+${android.defaultConfig.versionCode}"

        def updatedLines = lines.collect { line ->
            if (line.startsWith("version:")) {
                return newVersion
            }
            return line
        }

        pubspecFile.text = updatedLines.join("\n")
    } else {
        throw new GradleException("pubspec.yaml file not found!")
    }
}
task updatePubspecVersion {
    doLast {
        def flutterSdkPath = System.getenv("FLUTTER_HOME") ?: "${System.properties['user.home']}/flutter"

        exec {
            commandLine flutterSdkPath + "/bin/flutter", "pub", "get"
        }
    }
}

preBuild.dependsOn(updatePubspecVersion)

flutter {
    source = "../.."
}
dependencies {
   // implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
   implementation("androidx.appcompat:appcompat:1.6.1")
    implementation("androidx.multidex:multidex:2.0.1")
    implementation 'com.google.android.material:material:1.11.0'
}